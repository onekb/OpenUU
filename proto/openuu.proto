syntax = "proto3";

package openuu.v1;

// Top-level reliable control message sent on QUIC Stream 0 (length-prefixed: [u32 BE len][payload]).
message ControlEnvelope {
  uint64 seq = 1;
  oneof payload {
    // 1. Handshake & App Discovery
    Hello hello = 10;
    HelloAck hello_ack = 11;
    ListAppsRequest list_apps_req = 12;
    ListAppsResponse list_apps_resp = 13;
    StartSessionRequest start_session = 14;
    StartSessionResponse start_session_resp = 15;
    StopSessionRequest stop_session = 16;

    // 2. Window Topology & Control
    WindowTopologyUpdate window_topology = 20;
    ResizeWindowRequest resize_window = 21;
    FocusWindowRequest focus_window = 22;
    RequestKeyframe request_keyframe = 23;
    AudioControlRequest audio_control = 24;

    // 3. Input Events & Local IME Text Commit
    MouseEvent mouse_event = 30;
    ScrollEvent scroll_event = 31;
    KeyEvent key_event = 32;
    TextCommitEvent text_commit = 33;

    // 4. Clipboard & File Drop
    ClipboardSync clipboard_sync = 40;
    FileDropAction file_drop = 41;

    // 5. Notifications, Badge & Cursor
    NotificationEvent notification = 50;
    BadgeUpdate badge_update = 51;
    CursorUpdate cursor_update = 52;

    // 6. Keepalive
    Ping ping = 60;
    Pong pong = 61;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string device_id = 2;
  string device_name = 3;
  string os = 4;               // "macos", "windows", "linux"
  string pairing_pin = 5;      // Pairing PIN / access password on first connection
  string public_key = 6;       // Ed25519 EndpointId or TLS cert SHA-256 fingerprint
}

message HelloAck {
  bool accepted = 1;
  string reason = 2;
  string device_id = 3;
  string device_name = 4;
  string os = 5;
  string public_key = 6;       // Host Ed25519 EndpointId or TLS cert SHA-256 fingerprint
}

message AppInfo {
  string bundle_id = 1;        // e.g. "com.tencent.xinWeChat"
  string name = 2;             // e.g. "WeChat"
  uint32 pid = 3;
  uint32 window_count = 4;
  string icon_png_b64 = 5;     // 128x128 PNG icon encoded as base64
}

message ListAppsRequest {}

message ListAppsResponse {
  repeated AppInfo apps = 1;
}

message StartSessionRequest {
  string bundle_id = 1;
  uint32 window_id = 2;        // 0 = auto-select main window of bundle_id
  uint32 max_fps = 3;          // e.g. 60
  uint32 codec = 4;            // 1 = H.264, 2 = HEVC
}

message StartSessionResponse {
  bool ok = 1;
  string error = 2;
  uint32 primary_window_id = 3;
}

message StopSessionRequest {
  uint32 window_id = 1;
}

message WindowInfo {
  uint32 window_id = 1;
  uint32 parent_window_id = 2;
  enum Kind {
    MAIN = 0;
    POPUP = 1;
    MENU = 2;
  }
  Kind kind = 3;
  float rel_x = 4;
  float rel_y = 5;
  float width = 6;
  float height = 7;
  float scale_factor = 8;
  string title = 9;
  uint32 z_order = 10;
  string icon_png_b64 = 11;
}

message WindowTopologyUpdate {
  repeated WindowInfo windows = 1;
}

message ResizeWindowRequest {
  uint32 window_id = 1;
  float width = 2;
  float height = 3;
}

message FocusWindowRequest {
  uint32 window_id = 1;
}

message RequestKeyframe {
  uint32 window_id = 1;
}

message AudioControlRequest {
  bool enabled = 1;            // Whether Client wants Host to stream remote audio
  bool mute_host = 2;          // Whether Host should mute its local speakers while streaming
}

message MouseEvent {
  uint32 window_id = 1;
  float x = 2;                 // Logical pt relative to window top-left
  float y = 3;
  enum Type {
    MOVE = 0;
    DOWN = 1;
    UP = 2;
    DRAG = 3;
  }
  Type type = 4;
  uint32 button = 5;           // 0 = Left, 1 = Right, 2 = Middle
  uint32 click_count = 6;
  uint32 modifiers = 7;        // Bitmask: 1=Shift, 2=Ctrl, 4=Opt/Alt, 8=Cmd/Meta
}

message ScrollEvent {
  uint32 window_id = 1;
  float x = 2;
  float y = 3;
  float delta_x = 4;
  float delta_y = 5;
  bool is_continuous = 6;      // true for macOS trackpad pixel scrolling
  uint32 modifiers = 7;
}

message KeyEvent {
  uint32 window_id = 1;
  uint32 key_code = 2;         // macOS virtual keycode (CGKeyCode)
  bool is_down = 3;
  bool is_repeat = 4;
  uint32 modifiers = 5;
}

message TextCommitEvent {
  uint32 window_id = 1;
  string text = 2;             // Composed UTF-8 text from local IME
}

message ClipboardSync {
  string content_hash = 1;
  enum Kind {
    TEXT = 0;
    IMAGE = 1;
    FILES = 2;
  }
  Kind kind = 2;
  string text = 3;
  string blob_id = 4;
  string mime_type = 5;
  bytes image_data = 6;
}

message FileDropAction {
  uint32 window_id = 1;
  float x = 2;
  float y = 3;
  string blob_id = 4;
  string filename = 5;
  uint64 total_bytes = 6;
  uint64 received_bytes = 7;
  uint32 state = 8;            // 0 = COMPLETED, 1 = STARTED, 2 = PROGRESS, 3 = FAILED
}

message NotificationEvent {
  string app_bundle_id = 1;
  string title = 2;
  string subtitle = 3;
  string body = 4;
  uint64 timestamp_ms = 5;
}

message BadgeUpdate {
  string app_bundle_id = 1;
  string badge_text = 2;
}

message CursorUpdate {
  string kind = 1;             // "arrow", "ibeam", "pointing_hand", "resize_lr", "resize_ud", "open_hand", "closed_hand", "crosshair", "custom"
  bytes png_data = 2;
  float hotspot_x = 3;
  float hotspot_y = 4;
}

message Ping {
  uint64 timestamp_us = 1;
}

message Pong {
  uint64 timestamp_us = 1;
}
