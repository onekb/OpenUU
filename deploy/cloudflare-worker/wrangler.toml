name = "openuu-coord"
main = "src/index.js"
compatibility_date = "2025-03-01"
workers_dev = false

routes = [
  { pattern = "openuu.1kb.ren", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/v1/*", "/health"]

[observability]
enabled = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "chameye-coord-db"
database_id = "e0e0f95c-632f-408c-9535-f6fa8b0dd2c8"
